<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h1>Student Form</h1>
    </div>
    <div>
        <p>Please fill the mandatory details :</p>
        <form action="post">
            <label for="name">Name :</label>
            <input type="text" id="name" name="name" placeholder="Name"><br><br>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="Mail id"><br><br>
            <label for="phone">Phone Number :</label>
            <input type="tel" id="phone" name="phone" placeholder="mobile no"><br><br>
            <label for="password">Password :</label>
            <input type="password" id="password" name="password" placeholder="xxxxxxxxxxxx"><br><br>
            <label for="gender">Gender :</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="others" name="gender" value="others">
            <label for="others">Others</label><br><br>
            <label for="course">Course :</label><br>
            <select name="course" id="course" title="Select Course">
                <option value="">Select Course</option>
                <option value="btech">B.Tech</option>
                <option value="bsc">B.Sc</option>
                <option value="ba">B.A</option>
                <option value="bcom">B.Com</option>
            </select><br><br>
            <label for="address">Address :</label>
            <textarea name="address" id="address" rows="5" cols="20"
                placeholder="Enter your address"></textarea><br><br>
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" min="13" max="150" placeholder="Age"><br><br>
            <input type="submit" value="Submit">
            <button type="reset">Reset</button>

        </form>
    </div>
    <footer>
        <div class="foot">
            <p>&copy; All Rights Reserved,GamePro</p>
        </div>
    </footer>

</body>

</html>
